<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>TV Launcher Probe</title>
<style>
  html, body { margin: 0; background: #0e1116; color: #e8eaed; font: 18px/1.3 system-ui, sans-serif; }
  body { padding: 24px 36px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  .row { display: flex; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 16px; border-radius: 10px; border: 2px solid #3a414d; background: #1b2029; color: inherit; }
  button:focus { outline: none; border-color: #8ab4f8; background: #263244; }
  pre { font-size: 16px; white-space: pre-wrap; background: #161a21; padding: 14px; border-radius: 10px; margin: 0 0 10px; }
  #status { color: #8ab4f8; }
</style>
</head>
<body>
<h1>TV launcher probe</h1>
<pre id="out"></pre>
<div id="status">Loaded. Use the arrows and OK to try a launch method.</div>
<div id="keys" style="color:#fdd663">Keys received: none yet</div>
<div class="row" id="buttons"></div>
<script>
// Each method tries to open an app. ?m=N runs method N automatically after 3 s,
// so a remote observer can tell which one works by watching the TV's state.
var NETFLIX = 'netflix';
var YOUTUBE = 'pkgapp://tv.vidaa.app.youtube/apps/start_youtube.sh';
var methods = [
  ['href netflix', function () { location.href = NETFLIX; }],
  ['href youtube', function () { location.href = YOUTUBE; }],
  ['open netflix', function () { window.open(NETFLIX); }],
  ['open youtube', function () { window.open(YOUTUBE); }]
];

var found = [];
for (var k in window) {
  if (/hisense|vidaa|omi_|launch/i.test(k)) found.push(k + ' : ' + typeof window[k]);
}
found.sort();
// Hisense_* functions are not always enumerable; check known names directly.
['Hisense_installApp', 'Hisense_uninstallApp', 'Hisense_launchApp', 'Hisense_GetBrand',
 'Hisense_GetModelName', 'Hisense_GetFirmWareVersion', 'Hisense_GetDeviceID'].forEach(function (n) {
  if (typeof window[n] !== 'undefined' && found.indexOf(n + ' : ' + typeof window[n]) < 0) found.push(n + ' : ' + typeof window[n]);
});
// Getters are numerous and unimportant here; list only the action functions.
var names = found.map(function (n) { return n.split(' : ')[0]; });
var actions = names.filter(function (n) { return !/^Hisense_Get/.test(n); });
var getters = names.length - actions.length;

// Look inside the objects that may be VIDAA's native bridge.
function members(name) {
  var o = window[name], out = [];
  if (o === null || o === undefined) return name + ': ' + o;
  if (typeof o === 'function') {
    var src = String(o).replace(/\s+/g, ' ');
    out.push('fn ' + src.slice(0, 240));
  }
  var seen = {};
  for (var p = o; p && p !== Object.prototype && p !== Function.prototype; p = Object.getPrototypeOf(p)) {
    Object.getOwnPropertyNames(p).forEach(function (k) {
      if (seen[k] || k === 'constructor' || k === 'prototype' || k === 'length' || k === 'name') return;
      seen[k] = 1;
      var t; try { t = typeof o[k]; } catch (e) { t = 'err'; }
      out.push(k + (t === 'function' ? '()' : ':' + t));
    });
  }
  return name + ' -> ' + (out.length ? out.join(', ') : '(no members)');
}

// How the Hisense_* wrappers talk to the bridge: show one example, plus every
// distinct string literal across all of them (the message vocabulary).
function src(n) { try { return String(window[n]).replace(/\s+/g, ' '); } catch (e) { return ''; } }
var vocab = {};
names.forEach(function (n) {
  (src(n).match(/['"][A-Za-z_.\/:]{3,48}['"]/g) || []).forEach(function (s) { vocab[s.slice(1, -1)] = 1; });
});
var example = src('Hisense_SetVolume');

// Remote keys may arrive as platform events instead of DOM key events.
var platformEvents = [];
try {
  omi_platform.addPlatformEventListener(function () {
    var a = [].slice.call(arguments).map(function (x) { return typeof x === 'string' ? x : JSON.stringify(x); });
    platformEvents.unshift(a.join(' ').slice(0, 160));
    platformEvents.length = Math.min(platformEvents.length, 4);
    document.getElementById('keys').textContent = 'Platform events: ' + platformEvents.join('  |  ');
  });
} catch (e) { platformEvents.push('listener error ' + e); }

document.getElementById('out').textContent =
  'SetVolume source: ' + example.slice(0, 420) +
  '\n\nStrings used by Hisense_* (' + Object.keys(vocab).length + '): ' + Object.keys(vocab).sort().join(', ').slice(0, 1600) +
  '\n\nUser agent:\n  ' + navigator.userAgent +
  '\n\nScreen: ' + screen.width + 'x' + screen.height + '  Window: ' + innerWidth + 'x' + innerHeight;

var row = document.getElementById('buttons');
var buttons = methods.map(function (m, i) {
  var b = document.createElement('button');
  b.textContent = (i + 1) + '. ' + m[0];
  b.onclick = function () { run(i); };
  row.appendChild(b);
  return b;
});
buttons[0].focus();

function run(i) {
  document.getElementById('status').textContent = 'Trying ' + (i + 1) + '. ' + methods[i][0] + ' ...';
  try { methods[i][1](); } catch (e) { document.getElementById('status').textContent = 'Method ' + (i + 1) + ' threw: ' + e; }
}

// Diagnostic: show every key event the page gets, and where focus is.
var keyLog = [];
['keydown', 'keyup', 'keypress'].forEach(function (type) {
  window.addEventListener(type, function (e) {
    keyLog.unshift(type + ' ' + e.keyCode + (e.key ? ' "' + e.key + '"' : ''));
    keyLog.length = Math.min(keyLog.length, 6);
    document.getElementById('keys').textContent = 'Keys received: ' + keyLog.join('  |  ');
  }, true);
});
setInterval(function () {
  var a = document.activeElement;
  document.getElementById('status').textContent = 'hasFocus=' + document.hasFocus() +
    '  active=' + (a ? a.tagName + ' ' + (a.textContent || '').slice(0, 20) : 'none');
}, 1000);

document.addEventListener('keydown', function (e) {
  var at = buttons.indexOf(document.activeElement);
  if (e.keyCode === 39) buttons[Math.min(at + 1, buttons.length - 1)].focus();
  if (e.keyCode === 37) buttons[Math.max(at - 1, 0)].focus();
});

var auto = /[?&]m=(\d+)/.exec(location.search);
if (auto) setTimeout(function () { run(+auto[1] - 1); }, 3000);
</script>
</body>
</html>
